name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    # Cap job runtime so a hung Zig fetch (or any other blocker) cannot
    # burn the full default GitHub Actions allocation. `zig build` +
    # `zig build test` for this repo completes in well under a minute,
    # so 10 is a generous ceiling.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The `box2d_c` package-dep is fetched from a fork of
      # erincatto/box2d pinned in `build.zig.zon`; Zig handles the
      # fetch + extraction at build time, no extra system libs needed
      # (Box2D is pure C, no audio/graphics deps).
      - name: Build
        run: zig build

      - name: Test
        run: zig build test
